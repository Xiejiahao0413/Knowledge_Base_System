version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      KBS_API_KEY: ${KBS_API_KEY:-}
    volumes:
      - ../chroma_db:/app/chroma_db
      - ../chat_history:/app/chat_history
      - ../data:/app/data

